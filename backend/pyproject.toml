[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plantdoctor-backend"
version = "0.1.0"
description = "PlantDoctor multimodal plant-health API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49,<1",
    "fastapi>=0.115,<1",
    "gunicorn>=23,<24",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "pillow-heif>=0.18,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0,<2",
    "redis>=5,<7",
    "slowapi>=0.1.9,<1",
    "structlog>=25,<26",
    "supabase>=2.15,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app/services", "app/utils"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
